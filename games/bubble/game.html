<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>解压泡泡 · 自动戳</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 50% 30%, #1b2a4a 0%, #0b1020 70%);
    color: #fff;
    user-select: none;
  }
  canvas { display: block; position: absolute; inset: 0; }

  .hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 18px 22px;
    pointer-events: none;
    z-index: 10;
  }
  .title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 2px;
    opacity: .8;
    line-height: 1.4;
  }
  .title small {
    display: block;
    font-size: 11px;
    font-weight: 400;
    opacity: .45;
    letter-spacing: 1px;
  }
  .stats { text-align: right; font-variant-numeric: tabular-nums; }
  .stats .count {
    font-size: 42px;
    font-weight: 800;
    line-height: 1;
    color: #e6f4ff;
    text-shadow: 0 0 24px rgba(120,190,255,.55), 0 2px 10px rgba(0,0,0,.4);
    transition: transform .1s ease-out;
  }
  .stats .count.bump { transform: scale(1.18); }
  .stats .label { font-size: 11px; opacity: .5; letter-spacing: 2px; margin-top: 4px; }
  .stats .sub { font-size: 12px; opacity: .7; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .stats .sub b { color: #7fd3ff; font-weight: 700; }
  .stats .combo {
    font-size: 13px; font-weight: 700; color: #9ae6b4; margin-top: 5px;
    opacity: 0; transition: opacity .2s;
  }
  .stats .combo.show { opacity: 1; }

  .hint {
    position: absolute; left: 0; right: 0; top: 46%;
    text-align: center; font-size: 14px; letter-spacing: 3px;
    opacity: 0; pointer-events: none; transition: opacity .6s;
    z-index: 9; text-shadow: 0 2px 20px rgba(0,0,0,.6);
  }
  .hint.show { opacity: .7; }

  .float {
    position: absolute; pointer-events: none;
    font-size: 20px; font-weight: 800; color: #9ae6b4;
    text-shadow: 0 2px 10px rgba(0,0,0,.5); z-index: 11;
    animation: floatUp .8s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(.6); }
    100% { opacity: 0; transform: translateY(-70px) scale(1.15); }
  }

  /* ---------- 商城 ---------- */
  .shop {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 14px; width: min(560px, calc(100% - 28px));
    background: rgba(18,28,48,.62);
    border: 1px solid rgba(255,255,255,.13);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: 20px; padding: 12px 14px 14px;
    box-shadow: 0 -10px 40px rgba(0,0,0,.45);
    z-index: 12;
  }
  .shop-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .shop-head .h { font-size: 13px; font-weight: 700; letter-spacing: 2px; opacity: .85; }
  .shop-head .bal { font-size: 12px; opacity: .7; font-variant-numeric: tabular-nums; }
  .shop-head .bal b { color: #9ae6b4; font-weight: 800; }
  .toggles { display: flex; gap: 7px; }
  .toggles button {
    font-family: inherit; font-size: 11px; font-weight: 600; color: #fff;
    border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06);
    padding: 5px 10px; border-radius: 999px; cursor: pointer; transition: background .2s;
  }
  .toggles button:hover { background: rgba(255,255,255,.15); }

  .item {
    width: 100%; display: flex; align-items: center; gap: 12px;
    padding: 11px 13px; margin-top: 8px;
    border-radius: 14px; border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.05); color: #fff; text-align: left;
    font-family: inherit; cursor: pointer;
    transition: background .18s, transform .1s, border-color .18s;
  }
  .item:hover:not(:disabled) { background: rgba(120,190,255,.16); border-color: rgba(120,190,255,.4); }
  .item:active:not(:disabled) { transform: scale(.985); }
  .item:disabled { opacity: .38; cursor: not-allowed; }
  .item .ico { font-size: 24px; width: 32px; text-align: center; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
  .item .info { flex: 1; display: flex; flex-direction: column; }
  .item .info b { font-size: 14px; }
  .item .info small { font-size: 11px; opacity: .6; margin-top: 3px; }
  .item .info small i { color: #7fd3ff; font-style: normal; font-weight: 700; }
  .item .price { font-size: 16px; font-weight: 800; color: #9ae6b4; white-space: nowrap; }
  .item .price small { font-size: 10px; opacity: .7; font-weight: 600; margin-left: 1px; }
  .item:disabled .price { color: #e6a3a3; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="hud">
  <div class="title">解压泡泡<small>戳一戳 · 攒次数 · 开自动</small></div>
  <div class="stats">
    <div class="count" id="count">0</div>
    <div class="label">可用次数</div>
    <div class="sub">累计 <b id="total">0</b> · 自动 <b id="rate">0</b>/秒</div>
    <div class="combo" id="combo">连击 x1</div>
  </div>
</div>

<div class="hint" id="hint">点它 · 按空格也能戳</div>

<div class="shop">
  <div class="shop-head">
    <div class="h">🛒 商城</div>
    <div class="toggles">
      <button id="sound">🔊 音效</button>
      <button id="reset">↺ 清零</button>
    </div>
  </div>

  <button class="item" id="buyAuto">
    <span class="ico">🖐️</span>
    <span class="info"><b>自动戳</b><small>每秒自动戳破 1 个 · 已拥有 <i id="autoOwned">0</i></small></span>
    <span class="price">50<small>次</small></span>
  </button>

  <button class="item" id="buyBubble">
    <span class="ico">🫧</span>
    <span class="info"><b>加一个泡泡</b><small>多一个可戳的泡泡 · 当前 <i id="bubbleOwned">1</i> 个</small></span>
    <span class="price">100<small>次</small></span>
  </button>

  <button class="item" id="buyRainbow">
    <span class="ico">🌈</span>
    <span class="info"><b>彩虹泡泡</b><small>每个 +10% 出现值 5 次的彩虹泡泡 · 几率 <i id="rainbowChance">0%</i></small></span>
    <span class="price">150<small>次</small></span>
  </button>
</div>

<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W, H, DPR;

/* ---------- 参数 ---------- */
const POP_DUR = 0.5;
const RESPAWN_DUR = 0.42;
const AUTO_COST = 50;
const BUBBLE_COST = 100;
const RAINBOW_COST = 150;
const RAINBOW_VALUE = 5;
const RAINBOW_STEP = 0.10;
const MAX_PARTICLES = 380;

/* ---------- 音效：Web Audio 合成 ---------- */
let actx = null, soundOn = true;
function initAudio() {
  if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === 'suspended') actx.resume();
}
function popSound(vol) {
  if (!soundOn || !actx) return;
  vol = vol == null ? 0.4 : vol;
  const t = actx.currentTime;
  const base = 280 + Math.random() * 320;
  const osc = actx.createOscillator();
  const gain = actx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(base * 1.7, t);
  osc.frequency.exponentialRampToValueAtTime(base * 0.5, t + 0.09);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(vol, t + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
  osc.connect(gain).connect(actx.destination);
  osc.start(t); osc.stop(t + 0.15);

  const nb = actx.createBuffer(1, actx.sampleRate * 0.05, actx.sampleRate);
  const d = nb.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * (1 - i/d.length) ** 2;
  const ns = actx.createBufferSource(); ns.buffer = nb;
  const nf = actx.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = 2000;
  const ng = actx.createGain(); ng.gain.value = vol * 0.33;
  ns.connect(nf).connect(ng).connect(actx.destination);
  ns.start(t);
}

/* ---------- 状态 ---------- */
let bubbles = [];
let particles = [];
let balance = 0;        // 可用次数（货币）
let totalPopped = 0;    // 累计戳破
let autoOwned = 0;      // 自动戳数量
let rainbowOwned = 0;   // 彩虹泡泡升级数量
let combo = 1, comboTimer = 0;
let autoAcc = 0;
let hudDirty = false;
let lastAutoSound = 0;

function rainbowProb() { return Math.min(1, rainbowOwned * RAINBOW_STEP); }

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layoutBubbles();
}
window.addEventListener('resize', resize);

/* ---------- 生成 / 布局 ---------- */
function newBubble() {
  return {
    x: W/2, y: H*0.5, r: 100, tx: W/2, ty: H*0.5, tr: 100,
    phase: 'respawn', t: 0, breath: Math.random() * 10,
    frags: [], flash: 0, rainbow: Math.random() < rainbowProb(),
  };
}

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

function layoutBubbles() {
  const n = bubbles.length;
  if (!n) return;
  const shopEl = document.querySelector('.shop');
  const shopH = shopEl ? shopEl.getBoundingClientRect().height : 250;

  const padX = 26, padTop = 110;
  const padBot = shopH + 30;
  const regionW = Math.max(80, W - padX * 2);
  const regionH = Math.max(80, H - padTop - padBot);

  const aspect = regionW / regionH;
  let cols = Math.max(1, Math.round(Math.sqrt(n * aspect)));
  cols = Math.min(cols, n);              // 不出现多余的空气列
  const rows = Math.ceil(n / cols);
  const cellW = regionW / cols;
  const cellH = regionH / rows;
  const r = Math.max(11, Math.min(150, Math.min(cellW, cellH) * 0.44));

  // 网格整体在区域内居中
  const x0 = padX + (regionW - cols * cellW) / 2 + cellW / 2;
  const y0 = padTop + (regionH - rows * cellH) / 2 + cellH / 2;
  const maxY = Math.max(padTop + r, H - padBot - r);

  for (let i = 0; i < n; i++) {
    const c = i % cols, ro = Math.floor(i / cols);
    const b = bubbles[i];
    b.tr = r;
    // 保证整个泡泡都在屏幕内
    b.tx = clamp(x0 + c * cellW, r, W - r);
    b.ty = clamp(y0 + ro * cellH, padTop + r, maxY);
  }
}

/* ---------- HUD ---------- */
const elCount = document.getElementById('count');
const elTotal = document.getElementById('total');
const elRate = document.getElementById('rate');
const elCombo = document.getElementById('combo');
const elAutoOwned = document.getElementById('autoOwned');
const elBubbleOwned = document.getElementById('bubbleOwned');
const elRainbowChance = document.getElementById('rainbowChance');
const btnAuto = document.getElementById('buyAuto');
const btnBubble = document.getElementById('buyBubble');
const btnRainbow = document.getElementById('buyRainbow');

function updateHUD(bump) {
  elCount.textContent = balance;
  elTotal.textContent = totalPopped;
  elRate.textContent = autoOwned;
  elAutoOwned.textContent = autoOwned;
  elBubbleOwned.textContent = bubbles.length;
  elRainbowChance.textContent = Math.round(rainbowProb() * 100) + '%';
  btnAuto.disabled = balance < AUTO_COST;
  btnBubble.disabled = balance < BUBBLE_COST;
  btnRainbow.disabled = balance < RAINBOW_COST;
  if (combo > 1) { elCombo.textContent = '连击 x' + combo; elCombo.classList.add('show'); }
  else elCombo.classList.remove('show');
  if (bump) {
    elCount.classList.add('bump');
    setTimeout(() => elCount.classList.remove('bump'), 110);
  }
}

/* ---------- 粒子 ---------- */
function spawnParticles(x, y, r, small, rainbow) {
  if (particles.length > MAX_PARTICLES) return;
  const n = small ? 6 : 14 + Math.floor(Math.random() * 8);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 5.5;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5,
      life: 1, decay: 0.018 + Math.random() * 0.02,
      size: 1.8 + Math.random() * (r * 0.11),
      hue: rainbow ? (i / n) * 360 : 160 + Math.random() * 130,
    });
  }
  if (!small) particles.push({ ring: true, x, y, rad: r * 0.55, life: 1, decay: 0.045, size: 0, hue: rainbow ? 300 : 195 });
}

function floatText(x, y, txt, color) {
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = txt;
  if (color) el.style.color = color;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

/* ---------- 戳破 ---------- */
function makeFrags(r) {
  const n = 9 + Math.floor(Math.random() * 4);
  const frags = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
    frags.push({
      ang: a, dist: r * (0.25 + Math.random() * 0.2),
      speed: 2.6 + Math.random() * 3.4,
      len: r * (0.28 + Math.random() * 0.22),
      arc: r, spin: (Math.random() - 0.5) * 3, rot: a,
    });
  }
  return frags;
}

function popBubble(b, isAuto) {
  if (!b || b.phase !== 'idle') return false;
  const rainbow = b.rainbow;
  const gain = rainbow ? RAINBOW_VALUE : 1;
  b.phase = 'pop'; b.t = 0;
  b.frags = makeFrags(b.r); b.flash = 1;
  totalPopped += gain; balance += gain;
  if (rainbow) {
    floatText(b.x - 22, b.y - b.r - 16, '+' + RAINBOW_VALUE, '#f687b3');
  }
  if (!isAuto) {
    combo = Math.min(combo + 1, 9999); comboTimer = 0.9;
    if (combo % 10 === 0) floatText(b.x - 40, b.y - b.r - 20, 'x' + combo + ' 连击!', '#f6e05e');
    updateHUD(true);
  } else {
    hudDirty = true;
  }
  if (!isAuto) {
    popSound(rainbow ? 0.5 : 0.4);
  } else if (actx && soundOn) {
    const now = actx.currentTime;
    if (now - lastAutoSound > 0.045) { popSound(rainbow ? 0.16 : 0.11); lastAutoSound = now; }
  }
  spawnParticles(b.x, b.y, b.r, isAuto, rainbow);
  return true;
}

function idleBubbles() { return bubbles.filter(b => b.phase === 'idle'); }

function manualPop(px, py) {
  for (const b of bubbles) {
    if (b.phase !== 'idle') continue;
    const dx = px - b.x, dy = py - b.y;
    if (dx*dx + dy*dy <= (b.r * 1.15) ** 2) { popBubble(b, false); return; }
  }
}

function getPos(e) {
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX, y: t.clientY };
}
canvas.addEventListener('pointerdown', e => { initAudio(); const p = getPos(e); manualPop(p.x, p.y); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault(); initAudio();
    const idle = idleBubbles();
    if (idle.length) popBubble(idle[(Math.random() * idle.length) | 0], false);
  }
});

/* ---------- 商城按钮 ---------- */
btnAuto.addEventListener('click', () => {
  initAudio();
  if (balance < AUTO_COST) return;
  balance -= AUTO_COST; autoOwned++;
  updateHUD(true);
});
btnBubble.addEventListener('click', () => {
  initAudio();
  if (balance < BUBBLE_COST) return;
  balance -= BUBBLE_COST;
  const b = newBubble();
  bubbles.push(b);
  layoutBubbles();
  // 新泡泡从目标位置就地鼓起（respawn 动画）
  b.x = b.tx; b.y = b.ty; b.r = b.tr;
  updateHUD(true);
});
btnRainbow.addEventListener('click', () => {
  initAudio();
  if (balance < RAINBOW_COST) return;
  balance -= RAINBOW_COST;
  rainbowOwned++;
  updateHUD(true);
});
document.getElementById('reset').addEventListener('click', () => {
  balance = 0; totalPopped = 0; combo = 1; autoOwned = 0; rainbowOwned = 0;
  bubbles = [newBubble()];
  const b = bubbles[0];
  layoutBubbles();
  b.x = b.tx; b.y = b.ty; b.r = b.tr; b.phase = 'idle'; b.t = 1;
  particles = [];
  updateHUD();
});
const btnSound = document.getElementById('sound');
btnSound.addEventListener('click', () => {
  initAudio();
  soundOn = !soundOn;
  btnSound.textContent = soundOn ? '🔊 音效' : '🔇 静音';
});

/* ---------- 更新 ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

function update(dt) {
  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) { combo = 1; updateHUD(); } }

  // 自动戳
  if (autoOwned > 0) {
    autoAcc += autoOwned * dt;
    let guard = 0;
    while (autoAcc >= 1 && guard < 400) {
      const idle = idleBubbles();
      if (!idle.length) break;               // 没有空闲泡泡就攒着
      popBubble(idle[(Math.random() * idle.length) | 0], true);
      autoAcc -= 1; guard++;
    }
    const cap = Math.max(1, Math.min(autoOwned, 30));
    if (autoAcc > cap) autoAcc = cap;
  }
  if (hudDirty) { updateHUD(); hudDirty = false; }

  // 泡泡
  for (const b of bubbles) {
    const k = Math.min(1, dt * 8);
    b.x += (b.tx - b.x) * k;
    b.y += (b.ty - b.y) * k;
    b.r += (b.tr - b.r) * k;

    if (b.phase === 'idle') {
      b.breath += dt * 2;
    } else if (b.phase === 'pop') {
      b.t += dt / POP_DUR;
      if (b.t >= 1) { b.t = 0; b.phase = 'respawn'; b.frags = []; b.rainbow = Math.random() < rainbowProb(); }
    } else {
      b.t += dt / RESPAWN_DUR;
      if (b.t >= 1) { b.t = 1; b.phase = 'idle'; }
    }
    if (b.flash > 0) b.flash = Math.max(0, b.flash - dt * 7);
    for (const f of b.frags) { f.dist += f.speed; f.speed *= 0.93; f.rot += f.spin * 0.06; }
  }

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= p.decay;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    if (p.ring) { p.rad += dt * 260; }
    else { p.vy += 0.18; p.vx *= 0.98; p.x += p.vx; p.y += p.vy; }
  }
}

/* ---------- 渲染 ---------- */
function render() {
  ctx.clearRect(0, 0, W, H);

  const g = ctx.createRadialGradient(W/2, H*0.32, 0, W/2, H*0.32, Math.max(W,H)*0.75);
  g.addColorStop(0, 'rgba(60,100,160,0.18)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  for (const b of bubbles) {
    if (b.phase === 'idle') {
      const s = 1 + Math.sin(b.breath) * 0.02;
      drawBubble(b.x, b.y, b.r * s, b.rainbow, b.breath);
    } else if (b.phase === 'pop') {
      drawPop(b);
    } else {
      drawDent(b, 1 - b.t);
      const easeOut = 1 - Math.pow(1 - b.t, 3);
      const s = 0.25 + 0.75 * easeOut;
      const overshoot = Math.sin(b.t * Math.PI) * 0.08;
      ctx.save();
      ctx.globalAlpha = Math.min(1, b.t * 2);
      drawBubble(b.x, b.y, b.r * (s + overshoot), b.rainbow, b.t * 6);
      ctx.restore();
    }
  }

  drawParticles();
}

function drawBubble(x, y, r, rainbow, phase) {
  ctx.save();

  if (rainbow) {
    const hueShift = (phase || 0) * 45;
    const lg = ctx.createLinearGradient(x - r, y - r, x + r, y + r);
    for (let s = 0; s <= 1.0001; s += 1/6) {
      lg.addColorStop(Math.min(1, s), `hsla(${(hueShift + s * 360) % 360}, 92%, 66%, 0.6)`);
    }
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fillStyle = lg; ctx.fill();

    const hl = ctx.createRadialGradient(x - r*0.3, y - r*0.35, r*0.05, x, y, r);
    hl.addColorStop(0, 'rgba(255,255,255,0.75)');
    hl.addColorStop(0.5, 'rgba(255,255,255,0.12)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fillStyle = hl; ctx.fill();

    ctx.beginPath();
    ctx.ellipse(x - r*0.34, y - r*0.4, r*0.16, r*0.24, -0.5, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();

    // 外发光
    ctx.beginPath(); ctx.arc(x, y, r + 2, 0, Math.PI*2);
    ctx.strokeStyle = `hsla(${(hueShift + 180) % 360}, 100%, 70%, 0.4)`;
    ctx.lineWidth = Math.max(2, r / 20);
    ctx.stroke();
    // 彩虹亮边
    ctx.beginPath(); ctx.arc(x, y, r - 1, 0, Math.PI*2);
    ctx.strokeStyle = `hsla(${(hueShift + 60) % 360}, 100%, 78%, 0.95)`;
    ctx.lineWidth = Math.max(1.2, r / 45);
    ctx.stroke();
    ctx.restore();
    return;
  }

  const grad = ctx.createRadialGradient(x - r*0.3, y - r*0.35, r*0.1, x, y, r);
  grad.addColorStop(0, 'rgba(225,248,255,0.6)');
  grad.addColorStop(0.5, 'rgba(150,200,235,0.3)');
  grad.addColorStop(1, 'rgba(90,140,190,0.18)');
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();

  const lw = Math.max(0.6, r / 70);
  ctx.beginPath();
  ctx.ellipse(x - r*0.34, y - r*0.4, r*0.18, r*0.26, -0.5, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x + r*0.32, y + r*0.34, r*0.09, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x, y, r - 0.8, 0, Math.PI*2);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = lw * 1.3;
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x, y, r - 2, 0.25 * Math.PI, 0.75 * Math.PI);
  ctx.strokeStyle = 'rgba(150,220,255,0.35)';
  ctx.lineWidth = lw * 2;
  ctx.stroke();
  ctx.restore();
}

function drawPop(b) {
  const t = b.t;
  const ease = 1 - (1 - t) * (1 - t);

  ctx.save();
  ctx.translate(b.x, b.y);

  if (b.flash > 0) {
    const life = b.flash;
    const fr = b.r * (0.5 + (1 - life) * 1.9);
    const fg = ctx.createRadialGradient(0, 0, 0, 0, 0, fr);
    fg.addColorStop(0, `rgba(255,255,255,${life * 0.9})`);
    fg.addColorStop(0.4, `rgba(180,225,255,${life * 0.45})`);
    fg.addColorStop(1, 'rgba(180,225,255,0)');
    ctx.beginPath(); ctx.arc(0, 0, fr, 0, Math.PI*2); ctx.fillStyle = fg; ctx.fill();
  }

  if (t < 0.55) {
    const rt = t / 0.55;
    ctx.beginPath();
    ctx.arc(0, 0, b.r * (0.4 + rt * 1.9), 0, Math.PI*2);
    ctx.strokeStyle = `rgba(190,230,255,${(1 - rt) * 0.55})`;
    ctx.lineWidth = 2.5 * (1 - rt) + 0.5;
    ctx.stroke();
  }

  ctx.globalAlpha = Math.max(0, 1 - ease * 1.15);
  let fi = 0;
  for (const f of b.frags) {
    const px = Math.cos(f.ang) * f.dist;
    const py = Math.sin(f.ang) * f.dist - ease * b.r * 0.15;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(f.rot);
    ctx.beginPath();
    ctx.arc(0, 0, f.arc, -f.len / f.arc, f.len / f.arc);
    ctx.strokeStyle = b.rainbow
      ? `hsla(${(fi * 40 + t * 260) % 360}, 95%, 70%, 0.95)`
      : 'rgba(210,240,255,0.9)';
    ctx.lineWidth = 2.2; ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();
    fi++;
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawDent(b, Math.min(1, t / 0.4));
}

function drawDent(b, alpha) {
  if (alpha <= 0) return;
  const rDent = b.r * 0.78;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(b.x, b.y);
  const pit = ctx.createRadialGradient(-rDent*0.2, -rDent*0.25, 0, 0, 0, rDent);
  pit.addColorStop(0, 'rgba(6,14,30,0.85)');
  pit.addColorStop(0.7, 'rgba(15,30,58,0.7)');
  pit.addColorStop(1, 'rgba(40,70,110,0.2)');
  ctx.beginPath(); ctx.arc(0, 0, rDent, 0, Math.PI*2); ctx.fillStyle = pit; ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 0, rDent, Math.PI*0.9, Math.PI*1.8);
  ctx.strokeStyle = 'rgba(150,200,255,0.4)';
  ctx.lineWidth = 1.4; ctx.stroke();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    if (p.ring) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.rad, 0, Math.PI*2);
      ctx.strokeStyle = `hsla(${p.hue}, 90%, 75%, ${p.life*0.5})`;
      ctx.lineWidth = 2 * p.life;
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.1, p.size * p.life), 0, Math.PI*2);
      ctx.fillStyle = `hsla(${p.hue}, 95%, 72%, ${p.life})`;
      ctx.fill();
    }
  }
}

/* ---------- 启动 ---------- */
const hint = document.getElementById('hint');
hint.classList.add('show');
setTimeout(() => hint.classList.remove('show'), 3000);

resize();
{
  const b = newBubble();
  bubbles.push(b);
  layoutBubbles();
  b.x = b.tx; b.y = b.ty; b.r = b.tr; b.phase = 'idle'; b.t = 1;
}
updateHUD();
requestAnimationFrame(frame);
// 字体/Emoji 加载后商城高度可能变化，稍后重新排版一次
setTimeout(layoutBubbles, 300);
window.addEventListener('load', layoutBubbles);
</script>
