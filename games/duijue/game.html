/* ---------------- 牌堆翻完 → 把弃牌堆重新洗回牌堆 ---------------- */
function reshuffleDiscard(){
  if(state.deck.length > 0 || state.discard.length === 0) return false;
  const n = state.discard.length;
  state.deck = shuffle(state.discard);        // 弃牌堆整堆洗匀后变成新牌堆
  state.discard = [];
  state.deck.forEach(c => { c._new = false; });   // 收回的牌不再算「本回合摸到」

  const zone = $('#deckZone');
  if(zone){
    zone.classList.add('reshuffling');
    const msg = $('#deckMsg');
    if(msg) msg.textContent = `↻ 洗牌 ${n}`;
    clearTimeout(reshuffleDiscard._t);
    reshuffleDiscard._t = setTimeout(() => { zone.classList.remove('reshuffling'); }, 700);
  }
  setTimeout(() => beep(520, .09, 'sine', .05), 0);
  setTimeout(() => beep(690, .09, 'sine', .045), 110);
  setTimeout(() => beep(880, .12, 'sine', .04), 220);
  log(`牌堆翻完了 · 把弃牌堆的 <b>${n}</b> 张牌重新洗成牌堆`, 'sys');
  return true;
}

/* ---------------- 回合开始：把手牌补至 4 张（牌堆不够就把弃牌堆洗回来） ---------------- */
function drawForTurn(p){
  const drew = [];
  while(state.hands[p].length < HAND_SIZE){
    if(state.deck.length === 0 && !reshuffleDiscard()) break;   // 弃牌堆也空了 → 真的没牌可补
    const c = state.deck.pop();
    c._new = true;
    state.hands[p].push(c);
    drew.push(c);
  }
  if(state.deck.length === 0) reshuffleDiscard();   // 手牌本来就满时也顺手补满牌堆，不让牌堆停在 0
  state.drawnIds = drew.map(c => c.id);
  if(drew.length){
    log(`${PLAYERS[p].label} 回合开始，手牌补至 <b>${state.hands[p].length}</b> 张，摸进 <b>${drew.map(cardLabel).join('、')}</b>`, 'p' + p);
  } else if(state.deck.length === 0){
    log(`${PLAYERS[p].label} 回合开始，牌堆和弃牌堆都空了，补不了牌（手牌 ${state.hands[p].length} 张）`, 'sys');
  }
  return drew;
}

/* ---------------- 交接遮罩 ---------------- */
function showHandoff(){
  const mode = state.handoffMode;
  const btn = $('#hoBtn'), av = $('#hoAvatar');

  if(mode === 'dodge'){
    const d = state.dodge, p = d.defender;
    const dg = state.hands[p].filter(c => c.dodge).length;
    const canCancel = state.skills[p] === 'cancel' && state.skillLeft[p] > 0;
    const ddmg = d.dmg || ATK_DMG;
    av.className = 'ho-avatar p' + p;
    av.textContent = PLAYERS[p].short;
    $('#hoTitle').innerHTML = `<b>${PLAYERS[p].label}</b> · 你被攻击了`;
    $('#hoSub').textContent = `${PLAYERS[d.attacker].label} ${d.viaSkill === 'letter' ? `发动技能把 ${cardLabel(d.atkCard)} 当攻击打出` : `打出 ${cardLabel(d.atkCard)}`}${ddmg > ATK_DMG ? `（双倍 ×2，要掉 ${ddmg} 滴）` : ''}，请把设备交给 ${PLAYERS[p].label} 决定挡不挡`;
    $('#hoCount').textContent = `🛡 手上闪避 ${dg} 张 · ♥ ${state.hp[p]} / ${HP_MAX}`;
    btn.textContent = dg ? '看我的闪避牌' : (canCancel ? '用技能抵消 ⊘' : '我没有闪避牌');
  } else if(mode === 'negate'){
    const g = state.negate, p = g.victim;
    const ng = state.hands[p].filter(c => c.neg).length;
    av.className = 'ho-avatar p' + p;
    av.textContent = PLAYERS[p].short;
    $('#hoTitle').innerHTML = `<b>${PLAYERS[p].label}</b> · 你被偷了`;
    $('#hoSub').textContent = `${PLAYERS[g.thief].label} 打出「偷取」，要从你手上拿走 1 张牌；请把设备交给 ${PLAYERS[p].label} 决定要不要用抵消牌挡下`;
    $('#hoCount').textContent = `⛔ 手上抵消牌 ${ng} 张 · 🂠 手牌 ${state.hands[p].length} 张`;
    btn.textContent = '看我的抵消牌';
  } else if(mode === 'back'){
    const p = state.turn;
    const toSteal = state.returnTo === 'steal';
    av.className = 'ho-avatar p' + p;
    av.textContent = PLAYERS[p].short;
    $('#hoTitle').innerHTML = `请把设备交回 <b>${PLAYERS[p].label}</b>`;
    $('#hoSub').textContent = toSteal
      ? '对方没有用抵消牌，交回后点一张暗牌拿走'
      : '闪避判定结束，交回后本回合只需点「结束回合」';
    $('#hoCount').textContent = `🂠 手牌 ${state.hands[p].length} 张 · ♥ ${state.hp[p]} / ${HP_MAX}`;
    btn.textContent = toSteal ? '继续挑牌' : '继续我的回合';
  } else {
    const p = state.turn;
    const first = mode === 'start';
    av.className = 'ho-avatar p' + p;
    av.textContent = PLAYERS[p].short;
    $('#hoTitle').innerHTML = first ? `牌已发好 · <b>${PLAYERS[p].label}</b> 先手` : `轮到 <b>${PLAYERS[p].label}</b>`;
    $('#hoSub').textContent = first
      ? `请把设备交给 ${PLAYERS[p].label}，第一回合手牌已补至 ${state.hands[p].length} 张`
      : `${PLAYERS[1 - p].label} 已结束回合，请把设备交给 ${PLAYERS[p].label}`;
    $('#hoCount').textContent = `🂠 手牌 ${state.hands[p].length} 张 · ♥ ${state.hp[p]} / ${HP_MAX}`;
    btn.textContent = '查看我的手牌';
  }

  // 遮罩上也提示接手人的技能
  const whose = mode === 'dodge' && state.dodge ? state.dodge.defender
              : mode === 'negate' && state.negate ? state.negate.victim
              : state.turn;
  const s = skillOf(whose), hs = $('#hoSkill');
  if(s){
    hs.style.display = '';
    hs.className = 'ho-skill ' + s.cls;
    hs.innerHTML = `${s.icon} 技能 <b>${s.name}</b> · ${leftText(whose)}`;
    hs.title = s.desc;
  } else {
    hs.style.display = 'none';
  }

  $('#handoff').classList.add('show');
  beep(520, .09, 'triangle', .04);
}
function hideHandoff(){
  $('#handoff').classList.remove('show');
}
function takeOver(){
  if(state.phase !== 'handoff') return;
  hideHandoff();
  const mode = state.handoffMode;

  // 被攻击方接手 → 只做一次闪避判定
  if(mode === 'dodge'){
    state.phase = 'dodge';
    state.selected = null;
    state.busy = false;
    state.dodgeResolved = false;
    state.notice = '';
    render();
    beep(660, .07, 'triangle', .04);
    return;
  }

  // 被偷方接手 → 决定要不要用抵消牌挡下这次偷取
  if(mode === 'negate'){
    state.phase = 'negate';
    state.selected = null;
    state.busy = false;
    state.negateResolved = false;
    state.notice = '';
    render();
    beep(660, .07, 'triangle', .04);
    return;
  }

  // 判定完交回行动方 → 被抵消了就只需结束回合；对方放弃抵抗则继续挑牌
  if(mode === 'back'){
    state.phase = state.returnTo === 'steal' ? 'steal' : 'playing';
    state.returnTo = 'playing';
    state.handoffMode = 'turn';
    state.selected = null;
    state.notice = '';
    render();
    beep(660, .07, 'triangle', .04);
    return;
  }

  // 正常交接 / 开局
  state.phase = 'playing';
  state.handoffMode = 'turn';
  state.selected = null;
  state.used = false;                    // 新回合：重新获得 1 个动作
  state.turnAction = null;
  state.notice = '';
  state.hands[state.turn].forEach(c => c._new = true);   // 翻开动画
  render();
  beep(660, .07, 'triangle', .04);
}

/* 判定完 → 把设备交回行动方（nextPhase：playing 已被抵消 / steal 对方放弃抵抗，继续挑牌） */
function handBackToAttacker(nextPhase = 'playing'){
  state.dodgeResolved = false;
  state.dodge = null;
  state.negate = null;
  state.negateResolved = false;
  state.returnTo = nextPhase;
  state.phase = 'handoff';
  state.handoffMode = 'back';
  state.selected = null;
  state.notice = '';
  render();
  showHandoff();
}

/* ---------------- 流程 ---------------- */
function newGame(){
  state.deck = shuffle(makeDeck());
  state.discard = [];
  state.hands = [[],[]];
  state.hp = [HP_MAX, HP_MAX];
  state.turn = 0;
  state.lastTurn = 0;
  state.selected = null;
  state.busy = false;
  state.phase = 'handoff';
  state.notice = '';
  state.drawnIds = [];
  state.used = false;
  state.turnAction = null;
  state.over = null;
  state.dodge = null;
  state.dodgeResolved = false;
  state.steal = null;
  state.negate = null;
  state.negateResolved = false;
  state.returnTo = 'playing';
  state.dblReady = [false,false];
  facedownEls = new Map();
  state.handoffMode = 'start';
  // 开局：每人随机抽 1 个技能
  state.skills = [0,1].map(() => SKILL_IDS[Math.floor(Math.random() * SKILL_IDS.length)]);
  state.skillLeft = state.skills.map(id => SKILLS[id].limit);
  $('#log').innerHTML = '';
  $('#newBtn').classList.remove('pulse');
  hideHandoff();
  document.querySelectorAll('.zone').forEach(z => z.className = z.className.replace(/\s*(hit|dead|block)/g, ''));

  for(let k = 0; k < DEAL_SIZE; k++){
    [0,1].forEach(p => {
      const c = state.deck.pop();
      c._new = true;
      state.hands[p].push(c);
    });
  }
  $('#deckZone').classList.remove('reshuffling');
  $('#deckMsg').textContent = '';
  log(`重新发牌：76 张牌（含 <b>8 张攻击牌</b> · <b>4 张闪避牌</b> · <b>4 张偷取牌</b> · <b>4 张抵消牌</b> · <b>2 张恢复牌</b> · <b>2 张双倍牌</b>），双方各发 ${DEAL_SIZE} 张、各 ${HP_MAX} 滴血；每回合开始手牌补至 ${HAND_SIZE} 张，牌堆翻完后弃牌堆会自动洗回来，玩家一先手`, 'sys');
  log(`开局抽技能 · 玩家一：<b>${skillOf(0).icon} ${skillOf(0).name}</b>（${leftText(0)}）／玩家二：<b>${skillOf(1).icon} ${skillOf(1).name}</b>（${leftText(1)}）`, 'sys');
  drawForTurn(0);                        // 第一回合开始：手牌补至 4 张
  render();
  showHandoff();
}

/* 对方能不能应对这次攻击：手上有闪避牌，或有「抵消」技能 */
function canRespond(p){
  if(state.hands[p].some(c => c.dodge)) return true;
  return state.skills[p] === 'cancel' && state.skillLeft[p] > 0;
}
/* 被偷的一方手上有没有「抵消」牌，能挡下这次偷取 */
function canNegateSteal(p){
  return state.hands[p].some(c => c.neg);
}

/* 弃 1 张 / 打 1 张攻击（含「字母攻击」技能）/ 打出 1 张偷取 —— 每回合只能做一个 */
async function commitAction(card, opts = {}){
  const p = state.turn;
  if(state.phase !== 'playing' || state.busy || !card) return;
  if(state.used) return;
  const foe = 1 - p;
  const asAttack = !!card.atk || opts.viaSkill === 'letter';
  // 偷取牌：对方手上还有牌才能真正偷；对方没牌时这张牌只能当普通牌弃掉
  const asSteal = !!card.steal && !asAttack && state.hands[foe].length > 0;
  // 恢复牌：自己不满血才回得动；血已满时这张牌只能当普通牌弃掉（不然白白浪费一个动作）
  const asHeal = !!card.heal && !asAttack && state.hp[p] < HP_MAX;
  // 双倍牌：自己还没带着「下一次攻击翻倍」时才有用；已经带着时只能当普通牌弃掉（不叠加）
  const asDbl = !!card.dbl && !asAttack && !state.dblReady[p];
  // 这张攻击牌是否吃到「双倍」；双倍是一次性的，打出攻击就用掉
  const doubled = asAttack && state.dblReady[p];
  const dmg = asAttack ? (doubled ? ATK_DMG * 2 : ATK_DMG) : 0;
  if(asAttack) state.dblReady[p] = false;
  state.busy = true;
  state.selected = null;
  state.notice = '';
  renderBanner();

  const el = handEls.get(card.id);
  await flyTo(el, (asAttack || asSteal) ? zoneSel(foe) : '#discardBox');

  state.hands[p] = state.hands[p].filter(c => c !== card);
  state.discard.push(card);
  state.drawnIds = state.drawnIds.filter(id => id !== card.id);
  state.busy = false;
  state.used = true;
  state.turnAction = {kind: asAttack ? 'attack' : asSteal ? 'steal' : asHeal ? 'heal'
                            : asDbl ? 'dbl' : 'discard',
                      card, blockedBy: null, viaSkill: opts.viaSkill || null, doubled, dmg};
  render();

  const tag = p === 0 ? 'p0' : 'p1';
  if(asDbl){
    state.dblReady[p] = true;
    render();
    beep(880, .1, 'triangle', .05);
    setTimeout(() => beep(1240, .12, 'triangle', .045), 110);
    log(`打出 <b>${cardLabel(card)}</b>：下一次打出的攻击伤害翻倍（掉 <b>${ATK_DMG * 2}</b> 滴血）`, tag);
    return;
  }
  if(asHeal){
    state.hp[p] = Math.min(HP_MAX, state.hp[p] + HEAL_HP);
    render();
    showHeal(p);
    log(`打出 <b>${cardLabel(card)}</b>，回 1 滴血，现在 <b>${state.hp[p]}</b> / ${HP_MAX}`, tag);
    return;
  }
  if(asSteal){
    state.steal = {thief: p, victim: foe};
    state.selected = null;
    state.notice = '';
    beep(760, .09, 'triangle', .045);
    // 对方手上有「抵消」牌 → 先把设备交给他，让他决定挡不挡；否则直接进入盲挑
    if(canNegateSteal(foe)){
      state.negate = {thief: p, victim: foe};
      state.negateResolved = false;
      state.phase = 'handoff';
      state.handoffMode = 'negate';
      render();
      showHandoff();
      log(`打出 <b>偷取</b> · ${PLAYERS[foe].label} 手上有 <b>抵消</b> 牌，等他决定挡不挡`, tag);
      return;
    }
    // 进入「挑牌」环节：对方手牌全部以暗牌铺开，由你盲挑 1 张拿走
    state.phase = 'steal';
    render();
    log(`打出 <b>偷取</b> · ${PLAYERS[foe].label} 的手牌全部翻成背面，等你盲挑 1 张`, tag);
    return;
  }
  if(asAttack){
    const dblTxt = doubled ? `（<b>×2 双倍</b>，掉 ${dmg} 滴血）` : '';
    if(opts.viaSkill === 'letter'){
      log(`发动技能 <b>⚔ 字母攻击</b>，把 <b>${cardLabel(card)}</b> 当作攻击打出${dblTxt}`, tag);
    } else {
      log(`用 <b>${cardLabel(card)}</b> 攻击 ${PLAYERS[foe].label}${dblTxt}`, tag);
    }
    if(canRespond(foe)){
      // 对方能应对 → 把设备交给他，由他决定挡不挡
      log(`${PLAYERS[foe].label} 可以应对这次攻击 · 等他决定`, 'sys');
      state.dodge = {attacker: p, defender: foe, atkCard: card, viaSkill: opts.viaSkill || null, dmg};
      state.dodgeResolved = false;
      state.handoffMode = 'dodge';
      state.phase = 'handoff';
      state.selected = null;
      state.notice = '';
      render();
      showHandoff();
      return;
    }
    applyAttackDamage();
  } else {
    beep(420, .06, 'triangle', .03);
    log(`弃掉 <b>${cardLabel(card)}</b>（本回合就这一个动作），手牌还剩 ${state.hands[p].length} 张`, tag);
  }
}

/* ---------------- 技能：✚ 治疗（弃 1 张红色牌，回 1 滴血） ---------------- */
async function useHeal(card){
  const p = state.turn;
  if(state.phase !== 'playing' || state.busy || state.used) return;
  if(state.skills[p] !== 'heal' || state.skillLeft[p] <= 0) return;
  if(!isRedPlain(card)) return;

  state.busy = true;
  state.selected = null;
  state.notice = '';
  renderBanner();
  await flyTo(handEls.get(card.id), '#discardBox');

  state.hands[p] = state.hands[p].filter(c => c !== card);
  state.discard.push(card);
  state.drawnIds = state.drawnIds.filter(id => id !== card.id);
  state.skillLeft[p]--;
  const healed = state.hp[p] < HP_MAX;
  state.hp[p] = Math.min(HP_MAX, state.hp[p] + 1);
  state.busy = false;
  state.used = true;
  state.turnAction = {kind:'skill', skill:'heal', card, blockedBy:null, viaSkill:'heal'};
  render();
  if(healed) showHeal(p);
  log(`发动技能 <b>✚ 治疗</b>：弃掉 <b>${cardLabel(card)}</b>（红色牌），回 1 滴血，现在 <b>${state.hp[p]}</b> / ${HP_MAX}，技能剩 ${state.skillLeft[p]} 次`, 'p' + p);
}

/* 技能按钮：行动阶段用技能，判定阶段用「抵消」 */
function useSkillBtn(){
  if(state.phase === 'dodge'){ cancelAttack(); return; }
  if(state.phase !== 'playing' || state.busy || state.used || !state.selected) return;
  const p = state.turn;
  const card = state.hands[p].find(c => c.id === state.selected);
  if(!card) return;
  if(state.skills[p] === 'heal' && state.skillLeft[p] > 0 && isRedPlain(card) && state.hp[p] < HP_MAX){
    useHeal(card);
  } else if(state.skills[p] === 'letter' && isLetter(card)){
    commitAction(card, {viaSkill:'letter'});
  }
}

/* 对方没有闪避牌 → 直接结算伤害（点数取自本回合打出的攻击，可能被「双倍」翻倍） */
function applyAttackDamage(){
  const p = state.turn, foe = 1 - p;
  const dmg = (state.turnAction && state.turnAction.dmg) || ATK_DMG;
  state.hp[foe] = Math.max(0, state.hp[foe] - dmg);
  state.selected = null;
  render();                     // 先刷新血条，再放命中动效（动效元素挂在牌区上）
  showHit(foe, dmg);
  log(`${PLAYERS[foe].label} 掉 ${dmg} 滴血，剩 <b>${state.hp[foe]}</b> / ${HP_MAX}`, p === 0 ? 'p0' : 'p1');
  if(state.hp[foe] === 0){
    state.busy = true;
    render();                   // 让命中动效播完再收尾
    setTimeout(() => { state.busy = false; finishGame(p, `${PLAYERS[foe].label} 血量归零`); }, 660);
  }
}

/* 被攻击方选择「承受伤害」 */
async function acceptHit(){
  if(state.phase !== 'dodge' || state.busy || state.dodgeResolved) return;
  const d = state.dodge, foe = d.defender, p = d.attacker;
  const dmg = d.dmg || ATK_DMG;
  state.dodgeResolved = true;
  state.selected = null;
  state.hp[foe] = Math.max(0, state.hp[foe] - dmg);
  render();
  showHit(foe, dmg);
  log(`没有使用闪避，掉 ${dmg} 滴血，剩 <b>${state.hp[foe]}</b> / ${HP_MAX}`, 'p' + foe);
  if(state.hp[foe] === 0){
    await sleep(680);
    finishGame(p, `${PLAYERS[foe].label} 血量归零`);
    return;
  }
  await sleep(780);
  handBackToAttacker();
}

/* 被攻击方用掉一张闪避牌挡下这次攻击 */
async function useDodge(){
  if(state.phase !== 'dodge' || state.busy || state.dodgeResolved) return;
  const d = state.dodge;
  const card = state.hands[d.defender].find(c => c.id === state.selected);
  if(!card || !card.dodge) return;

  state.busy = true;
  state.selected = null;
  renderBanner();
  await flyTo(handEls.get(card.id), '#discardBox');

  state.hands[d.defender] = state.hands[d.defender].filter(c => c !== card);
  state.discard.push(card);
  state.busy = false;
  state.dodgeResolved = true;
  if(state.turnAction) state.turnAction.blockedBy = card;
  render();
  showBlock(d.defender);
  log(`用 <b>${cardLabel(card)}</b> 挡下了这次攻击，1 滴血都没掉`, 'p' + d.defender);
  await sleep(800);
  handBackToAttacker();
}

/* 被攻击方用「⊘ 抵消」技能挡下这次攻击（每局限 1 次） */
async function cancelAttack(){
  if(state.phase !== 'dodge' || state.busy || state.dodgeResolved) return;
  const d = state.dodge;
  if(state.skills[d.defender] !== 'cancel' || state.skillLeft[d.defender] <= 0) return;

  state.dodgeResolved = true;
  state.skillLeft[d.defender]--;
  state.selected = null;
  if(state.turnAction) state.turnAction.blockedBy = {skill:'cancel'};
  render();
  showBlock(d.defender, '⊘ 抵消');
  log(`发动技能 <b>⊘ 抵消</b>：抵消了这次攻击，1 滴血都没掉，本局技能已用完`, 'p' + d.defender);
  await sleep(840);
  handBackToAttacker();
}

/* ---------------- 抵消：被偷的一方用「抵消」牌废掉这次偷取 ---------------- */
async function useNegate(){
  if(state.phase !== 'negate' || state.busy || state.negateResolved) return;
  const g = state.negate;
  const card = state.hands[g.victim].find(c => c.id === state.selected);
  if(!card || !card.neg) return;

  state.busy = true;
  state.selected = null;
  renderBanner();
  await flyTo(handEls.get(card.id), '#discardBox');

  state.hands[g.victim] = state.hands[g.victim].filter(c => c !== card);
  state.discard.push(card);
  state.busy = false;
  state.negateResolved = true;
  if(state.turnAction) state.turnAction.blockedBy = card;
  state.steal = null;
  render();
  showBlock(g.victim, '⛔ 抵消');
  log(`用 <b>抵消</b> 牌挡下了这次偷取，1 张牌都没被拿走`, 'p' + g.victim);
  await sleep(820);
  handBackToAttacker('playing');
}

/* 被偷的一方放弃抵消 → 交回给偷牌的人继续盲挑 */
function declineNegate(){
  if(state.phase !== 'negate' || state.busy || state.negateResolved) return;
  state.negateResolved = true;
  state.selected = null;
  log(`${PLAYERS[state.negate.victim].label} 没有用抵消牌，让对方继续挑`, 'p' + state.negate.victim);
  render();
  handBackToAttacker('steal');
}

/* ---------------- 偷取：从对方手牌里盲挑 1 张拿走 ---------------- */
async function resolveSteal(victimCard){
  const s = state.steal;
  if(!s || state.busy) return;
  const thief = s.thief, victim = s.victim;
  const card = state.hands[victim].find(c => c.id === victimCard.id);
  if(!card) return;

  state.busy = true;
  state.selected = null;
  renderBanner();
  await flyTo(facedownEls.get(card.id), zoneSel(thief));   // 暗牌飞向偷牌的人

  state.hands[victim] = state.hands[victim].filter(c => c !== card);
  card._new = true;                     // 进手牌时翻开、播放动画
  state.hands[thief].push(card);
  state.steal = null;
  facedownEls = new Map();
  state.busy = false;
  state.phase = 'playing';              // 回到行动阶段：本回合动作已用完，只剩「结束回合」
  state.selected = null;
  state.notice = '';
  render();
  beep(880, .1, 'triangle', .05);
  log(`从 ${PLAYERS[victim].label} 手上拿走 1 张牌（盲挑 · 牌面只有拿到的人能看到）`, 'p' + thief);
}

/* 结束本局 */
function finishGame(winner, reason){
  state.phase = 'done';
  state.selected = null;
  state.drawnIds = [];
  state.used = false;
  state.busy = false;
  state.turnAction = null;
  state.dodge = null;
  state.dodgeResolved = false;
  state.steal = null;
  state.negate = null;
  state.negateResolved = false;
  state.returnTo = 'playing';
  state.dblReady = [false,false];
  facedownEls = new Map();
  state.over = {winner, reason};
  render();
  log(reason + (winner === null ? '' : ` · ${PLAYERS[winner].label} 赢下本局`), 'sys');
  beep(523, .2, 'triangle', .05);
}

function endTurn(){
  if(state.phase !== 'playing' || state.busy) return;

  const p = state.turn;
  const next = 1 - p;

  // 必须先做一个动作（弃 1 张 或 打 1 张攻击）才能结束回合
  if(!state.used && state.hands[p].length > 0){
    state.notice = '本回合必须先做一个动作：弃 1 张，或打 1 张攻击';
    render();
    log(`${PLAYERS[p].label} 这回合还没出牌，不能结束回合`, 'sys');
    return;
  }

  state.selected = null;
  state.notice = '';
  state.drawnIds = [];
  state.used = false;                        // 下家重新获得 1 个动作
  state.turnAction = null;
  state.lastTurn = p;
  state.turn = next;
  log(`结束回合，交给 ${PLAYERS[next].label}`, 'sys');
  drawForTurn(next);                       // 下家回合开始：手牌补至 4 张

  if(state.hands[next].length === 0){
    // 牌堆 + 弃牌堆都空了，连一张都补不上 → 本局收尾（谁也没被打倒）
    finishGame(null, '所有牌都打完了');
    return;
  }

  state.phase = 'handoff';
  state.handoffMode = 'turn';
  render();                                   // 先把所有手牌收起
  showHandoff();                              // 立即全屏遮住，不露出任何牌
}

function pick(p, cardId){
  // 偷取挑牌：点到对方任意一张暗牌，立即把它拿走
  if(state.phase === 'steal'){
    if(state.busy || !state.steal || state.steal.victim !== p) return;
    const c = state.hands[p].find(x => x.id === cardId);
    if(c) resolveSteal(c);
    return;
  }

  const judge = state.phase === 'dodge';
  const negJudge = state.phase === 'negate';
  if(!judge && !negJudge && state.phase !== 'playing') return;
  if(state.busy || state.dodgeResolved || state.negateResolved) return;

  if(judge){
    if(!state.dodge || state.dodge.defender !== p) return;
    const c = state.hands[p].find(x => x.id === cardId);
    if(!c || !c.dodge) return;               // 判定时只能点闪避牌
  } else if(negJudge){
    if(!state.negate || state.negate.victim !== p) return;
    const c = state.hands[p].find(x => x.id === cardId);
    if(!c || !c.neg) return;                 // 抵消判定时只能点抵消牌
  } else {
    if(state.turn !== p) return;
    if(state.used) return;                   // 本回合的动作已经做完了
    const c = state.hands[p].find(x => x.id === cardId);
    if(!c) return;                           // 点普通牌=弃掉，点攻击牌=打出去
  }

  state.notice = '';
  state.selected = state.selected === cardId ? null : cardId;
  handEls.forEach((el, id) => el.classList.toggle('selected', id === state.selected));
  renderBanner();
}

/* 回合内：选中普通牌 → 弃掉；选中攻击牌 → 打出去；选中偷取牌且有牌可偷 → 进入挑牌。
   闪避判定：选中闪避牌 → 挡住；抵消判定：选中抵消牌 → 废掉这次偷取 */
function confirmAction(){
  if(state.phase === 'dodge'){ useDodge(); return; }
  if(state.phase === 'negate'){ useNegate(); return; }
  if(state.phase !== 'playing' || state.busy || !state.selected) return;
  const card = state.hands[state.turn].find(c => c.id === state.selected);
  if(!card) return;
  if(!canDiscard(card) && !card.atk) return;
  commitAction(card);
}

/* ---------------- 事件 ---------------- */
document.addEventListener('click', e => {
  state.userActed = true;
  const el = e.target.closest('.card');
  if(!el || !el.classList.contains('selectable')) return;
  const wrap = el.closest('.hand');
  if(!wrap) return;
  pick(Number(wrap.dataset.player), el.dataset.id);
});

$('#confirmBtn').addEventListener('click', confirmAction);
$('#skillBtn').addEventListener('click', useSkillBtn);
$('#endBtn').addEventListener('click', () => {
  if(state.phase === 'dodge'){ acceptHit(); return; }        // 闪避判定：这个按钮 = 承受伤害
  if(state.phase === 'negate'){ declineNegate(); return; }   // 抵消判定：这个按钮 = 不抵消
  endTurn();
});
$('#hoBtn').addEventListener('click', takeOver);
$('#newBtn').addEventListener('click', newGame);
$('#soundBtn').addEventListener('click', e => {
  state.sound = !state.sound;
  e.currentTarget.classList.toggle('on', state.sound);
  e.currentTarget.textContent = state.sound ? '🔊 音效' : '🔇 静音';
  if(state.sound) beep(660, .07, 'triangle', .05);
});

document.addEventListener('keydown', e => {
  const k = (e.key || '').toLowerCase();
  if(e.key === 'Escape' && (state.phase === 'playing' || state.phase === 'dodge' || state.phase === 'negate')){
    state.selected = null;
    handEls.forEach(el => el.classList.remove('selected'));
    renderBanner();
    return;
  }
  if(state.phase === 'handoff'){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); takeOver(); }
    return;
  }
  if(k === 'n' && !state.busy){ newGame(); return; }

  // 偷取挑牌：1/2/3/4 直接挑走对方第 N 张暗牌
  if(state.phase === 'steal'){
    if(state.busy || !state.steal) return;
    if(['1','2','3','4'].includes(e.key)){
      const c = state.hands[state.steal.victim][Number(e.key) - 1];
      if(c) resolveSteal(c);
    }
    return;
  }

  // 闪避判定：1/2/3/4 选闪避牌，Enter 挡住，E 承受伤害
  if(state.phase === 'dodge'){
    if(state.busy || state.dodgeResolved) return;
    if(['1','2','3','4'].includes(e.key)){
      const c = state.hands[state.dodge.defender].filter(x => x.dodge)[Number(e.key) - 1];
      if(c) pick(state.dodge.defender, c.id);
    }
    if(e.key === 'Enter') useDodge();
    if(k === 'e') acceptHit();
    if(k === 's') cancelAttack();
    return;
  }

  // 抵消判定：1/2/3/4 选抵消牌，Enter 挡下，E 不抵消、让他挑
  if(state.phase === 'negate'){
    if(state.busy || state.negateResolved) return;
    if(['1','2','3','4'].includes(e.key)){
      const c = state.hands[state.negate.victim].filter(x => x.neg)[Number(e.key) - 1];
      if(c) pick(state.negate.victim, c.id);
    }
    if(e.key === 'Enter') useNegate();
    if(k === 'e') declineNegate();
    return;
  }

  if(state.phase !== 'playing' || state.busy) return;
  if(['1','2','3','4','5'].includes(e.key)){
    const c = state.hands[state.turn][Number(e.key) - 1];
    if(c) pick(state.turn, c.id);
  }
  if(e.key === 'Enter') confirmAction();
  if(k === 's') useSkillBtn();
  if(k === 'e') endTurn();
});

/* ---------------- 启动 ---------------- */
render();
log('点击「重新发牌」开始', 'sys');
</script>
</body>
</html>
