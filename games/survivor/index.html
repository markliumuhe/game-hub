<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>霓虹幸存者 · 小游戏乐园</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  .bar {
    height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 16px;
    background: #161b22; border-bottom: 1px solid #30363d; color: #e6edf3; position: relative; z-index: 2;
  }
  .bar .back {
    color: #58a6ff; text-decoration: none; font-size: 14px; font-weight: 600;
    padding: 6px 12px; border: 1px solid #30363d; border-radius: 8px; transition: background .15s;
  }
  .bar .back:hover { background: #21262d; }
  .bar .title { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
  .bar .spacer { flex: 1; }
  .bar .new { color: #8b949e; text-decoration: none; font-size: 13px; }
  .bar .new:hover { color: #58a6ff; }
  .stage { position: absolute; top: 46px; left: 0; right: 0; bottom: 0; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #07070d; }
</style>
</head>
<body>
  <div class="bar">
    <a class="back" href="../../index.html">← 返回乐园</a>
    <span class="title">👾 霓虹幸存者</span>
    <span class="spacer"></span>
    <a class="new" href="game.html" target="_blank" rel="noopener">全屏打开 ↗</a>
  </div>
  <div class="stage">
    <iframe src="game.html" allow="pointer-lock; fullscreen; autoplay; gamepad"></iframe>
  </div>
</body>
</html>
